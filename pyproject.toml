[project]
name = "keylogger-detector"
version = "1.0.0"
description = "Detecta comportamiento típico de keyloggers y malware que roba contraseñas, analizando procesos en ejecución"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# pefile solo aporta valor en Windows (analiza imports de .exe).
# En Linux/macOS es un no-op — no rompe nada si no está instalado
windows = ["pefile>=2023.2.7"]
dev = ["pytest>=8.0.0"]

[project.scripts]
keylog-detect = "keylogger_detector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["keylogger_detector.py"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
